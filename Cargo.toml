[package]
name = "spriters"
version = "1.0.0"
authors = ["Sébastien LUNDI"]
categories = ["command-line-utilities", "multimedia::images", "algorithms", "game-development", "web-programming"]
edition = "2024"
keywords = ["sprites", "css-sprites", "sprite-sheet", "image-packing", "css"]
license = "GPL-3.0-or-later"
readme = "README.md"
repository = "https://codeberg.org/slundi/spriters"
description = "Fast CSS sprite generator — Rust reimplementation of Glue with SVG support, WebP/AVIF output, and multi-threaded processing"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "spriters"
path = "src/lib.rs"

[[bin]]
name = "spriters"
path = "src/main.rs"

[dependencies]
fraction = "0.17"
glob = "0.3"
image = { version = "0.25", features = ["avif"] }
lexopt = "0.3"
log = "0.4"
notify = "8"
png = "0.18"
rayon = "1"
resvg = "0.50"
serde = { version = "1", features = ["derive"] }
slug = "0.1"
stderrlog = "0.6"
thiserror = "2"
toml = "1.1"
twox-hash = "2.1"
walkdir = "2"

[dev-dependencies]
criterion = { version = "0.8", features = ["html_reports"] }

[[bench]]
name = "bench"
harness = false

[workspace.metadata.cargo-machete]
ignored = []


[package.metadata.cargo-machete]
ignored = []

# --- cargo-deb ---
# Packaged via `just deb` from the fully static musl amd64 binary, so the
# package carries no shared-library dependencies. Assets are listed explicitly
# to ship only the main binary (not the `gen_fixtures` dev helper) and to point
# at the musl target dir that `just deb` builds into.
[package.metadata.deb]
maintainer = "Sébastien LUNDI <slundi@ikmail.com>"
section = "net"
priority = "optional"
depends = ""
extended-description = """CLI to create sprites."""
# `target/release/` is a cargo-deb magic prefix — it rewrites it to the actual
# --target directory. Listing only this binary excludes the gen_fixtures helper.
assets = [
    [
        "target/release/pcap-toolkit",
        "usr/bin/",
        "755",
    ],
    [
        "README.md",
        "usr/share/doc/pcap-toolkit/README.md",
        "644",
    ],
    [
        "CHANGELOG.md",
        "usr/share/doc/pcap-toolkit/CHANGELOG.md",
        "644",
    ],
]

# --- Profiles ---

# Standard Dev Profile (Optimized for speed of compilation)
[profile.dev]
opt-level = 0
debug = true

# Production Release Profile
# This ensures the Nix-built binary is highly optimized
[profile.release]
opt-level = 3       # Max optimizations
lto = "fat"         # Link Time Optimization (smaller, faster binary)
codegen-units = 1   # Better optimizations at the cost of compile time
panic = "unwind"    # Kept (not "abort") so that --watch survives a panic during a regeneration
strip = "debuginfo" # Strip debug info but keep symbols so addr2line works on crash reports — useful for a forensic tool

# Profile for Benchmarking
[profile.bench]
inherits = "release"
debug = false

# --- Features ---
# [features]
# default = []
# async = ["dep:tokio"] # must be in dependencies

# --- cargo-dist ---
# Run `cargo dist init` to generate full CI integration.
# This project uses its own release workflow (.github/workflows/release.yaml);
# set dist = true here only if you want cargo-dist to manage releases instead.
[package.metadata.dist]
dist = false
targets = [
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
    "x86_64-apple-darwin",
    "aarch64-apple-darwin",
    "x86_64-pc-windows-msvc",
]
