[package]
name = "spriters"
version = "0.1.0"
authors = ["Sébastien LUNDI"]
categories = [
  "algorithms",
  "command-line-utilities",
  "compression",
  "game-development",
  "multimedia::images",
]
edition = "2021"
keywords = ["sprites"]
license = "Apache-2.0"
readme = "README.md"
repository = "https://codeberg.org/slundi/spriters"
description = "Generate sprites"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "spriters"
path = "src/lib.rs"

[[bin]]
name = "spriters"
path = "src/main.rs"

[dependencies]
fraction = "0.15"
image = { version = "0.25", features = ["avif"] }
lexopt = "0.3"
log = "0.4"
notify = "8"
rayon = "1"
resvg = "0.44"
serde = { version = "1", features = ["derive"] }
slug = "0.1"
stderrlog = "0.6"
toml = "1.1"
twox-hash = "2.1"
url = "2.5"
walkdir = "2"

[workspace.metadata.cargo-machete]
ignored = []
