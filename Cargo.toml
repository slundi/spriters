[package]
name = "spriters"
authors = ["Sébastien LUNDI"]
description = "Generate sprites"
readme = "README.md"
license = "Apache-2.0"
repository = "https://codeberg.org/slundi/spriters"
keywords = ["sprites"]
categories = [
    "algorithms",
    "command-line-utilities",
    "compression",
    "game-development",
    "multimedia::images",
]
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "spriters"
path = "src/lib.rs"

[[bin]]
name = "spriters"
path = "src/main.rs"

[dependencies]
image = "0.25"
lexopt = "0.3"

[workspace.metadata.cargo-machete]
ignored = []
