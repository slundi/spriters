[package]
name = "spriters"
authors = ["Sébastien LUNDI"]
description = "Generate sprites"
readme = "README.md"
license = "Apache-2.0"
repository = "https://codeberg.org/slundi/spriters"
keywords = ["sprites"]
categories = [
    "algorithms",
    "command-line-utilities",
    "compression",
    "game-development",
    "multimedia::images",
]
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "spriters"
path = "src/lib.rs"

[[bin]]
name = "spriters"
path = "src/main.rs"

[dependencies]
image = { version = "0.25", features = ["avif"] }
fraction = "0.15"
slug = "0.1"
lexopt = "0.3"
walkdir = "2"
log = "0.4"
stderrlog = "0.6"
url = "2.5"
twox-hash = "2.1"
notify = "8"
serde = { version = "1", features = ["derive"] }
toml = "1.1"
rayon = "1"
resvg = "0.44"

[workspace.metadata.cargo-machete]
ignored = []
