[advisories]
version = 2
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]
# Scope of unmaintained crate detection: all/workspace/transitive/none
unmaintained = "all"
yanked = "warn"
ignore = [
  # RUSTSEC-2023-0089: atomic-polyfill unmaintained — transitive via postcard→heapless
  # heapless has no maintained alternative yet; low-severity (no CVE, no exploit)
  { id = "RUSTSEC-2023-0089", reason = "Transitive via postcard→heapless; no exploit, no maintained alternative" },
]

[licenses]
version = 2
allow = [
  "GPL-3.0-only",
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-3.0",
  # webpki-roots v1.0+
  "CDLA-Permissive-2.0",
  "Zlib",
]
confidence-threshold = 0.8
exceptions = []

[bans]
multiple-versions = "warn"
# workspace = true deps are treated as wildcards by cargo-deny; suppress to avoid
# false positives on internal crate references
wildcards = "warn"
highlight = "all"
deny = []
skip = []
skip-tree = []

[sources]
unknown-registry = "warn"
unknown-git = "warn"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
